spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/urban_steps?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Cambiado a 8080 para coincidir con el Dockerfile y estándares de producción
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
